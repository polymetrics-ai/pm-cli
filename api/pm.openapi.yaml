    post:
      tags: [runs]
      summary: Persist an explicit cancellation intent
      operationId: cancelRun
      description: >-
        Persists an authorized cancellation command under the scoped request key.
        HTTP 202 means the command is durable; it never asserts that orchestration
        stopped or that provider work was terminated. Current authorization is
        checked before replay disclosure. Exact replay may be resolved before the
        current If-Match comparison; every new mutation requires If-Match.
      security:
        - PMSession: []
        - PMBrowserSession: []
