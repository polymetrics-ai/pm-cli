openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: PM ordinary public API
  version: 1.0.0
  description: >-
    Typed ordinary-client contract. Provider-secret ingress is server-only and
    deliberately absent from ordinary models, clients and this public document.
tags:
  - name: compatibility
  - name: invocation
  - name: access
  - name: sessions
  - name: workspaces
  - name: connections
  - name: catalog
  - name: runs
  - name: artifacts
paths:
  /v1/info:
    get:
      tags: [compatibility]
      summary: Discover the public wire compatibility contract
      operationId: getServerInfo
      security: []
      responses:
        "200":
          description: Minimal public compatibility information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInfo"
        "500":
          $ref: "#/components/responses/Problem500"
  /v1/sessions/device:
    post:
      tags: [sessions]
      summary: Start a bounded device login challenge
      operationId: startDeviceLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceStart"
      responses:
        "201":
          description: Unapproved expiring challenge; not a PM session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceChallenge"
        "400":
          $ref: "#/components/responses/Problem400"
        "429":
          $ref: "#/components/responses/Problem429"
        "503":
          $ref: "#/components/responses/Problem503"
  /v1/sessions/device/exchange:
    post:
      tags: [sessions]
      summary: Exchange one approved device proof exactly once
      operationId: exchangeDeviceLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceProof"
      responses:
        "200":
          description: Original one-time PM device session credential; store only in the client OS credential store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PMDeviceSession"
        "400":
          $ref: "#/components/responses/Problem400"
        "401":
          $ref: "#/components/responses/Problem401"
        "403":
          $ref: "#/components/responses/Problem403"
        "409":
          $ref: "#/components/responses/Problem409"
        "410":
          $ref: "#/components/responses/Problem410"
        "429":
          $ref: "#/components/responses/Problem429"
        "503":
          $ref: "#/components/responses/Problem503"
  /v1/sessions/device/approve:
    post:
      tags: [sessions]
      summary: Approve a device challenge as the current verified browser identity
      operationId: approveDeviceLogin
      security:
        - PMBrowserSession: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceApproval"
      responses:
        "204":
          description: Challenge approved without exposing or issuing a device session
        "400":
          $ref: "#/components/responses/Problem400"
        "401":
          $ref: "#/components/responses/Problem401"
        "403":
          $ref: "#/components/responses/Problem403"
        "409":
          $ref: "#/components/responses/Problem409"
        "410":
          $ref: "#/components/responses/Problem410"
        "503":
          $ref: "#/components/responses/Problem503"
  /v1/sessions/device/deny:
    post:
      tags: [sessions]
      summary: Deny a device challenge as the current verified browser identity
      operationId: denyDeviceLogin
      security:
        - PMBrowserSession: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceApproval"
      responses:
        "204":
          description: Challenge denied without issuing a session
        "400":
          $ref: "#/components/responses/Problem400"
        "401":
          $ref: "#/components/responses/Problem401"
        "403":
          $ref: "#/components/responses/Problem403"
        "409":
          $ref: "#/components/responses/Problem409"
        "410":
          $ref: "#/components/responses/Problem410"
        "503":
          $ref: "#/components/responses/Problem503"
  /v1/sessions/browser/challenges:
    post:
      tags: [sessions]
      summary: Start a configured OIDC login with server-held PKCE binding
      operationId: startBrowserLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserLoginStart"
      responses:
        "201":
          description: Authorization URL and expiry; the PKCE verifier is confined to a Secure HttpOnly challenge cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserLoginChallenge"
        "400":
          $ref: "#/components/responses/Problem400"
        "403":
          $ref: "#/components/responses/Problem403"
        "429":
          $ref: "#/components/responses/Problem429"
        "503":
          $ref: "#/components/responses/Problem503"
  /v1/sessions/browser:
    post:
      tags: [sessions]
      summary: Complete one configured OIDC callback with state, nonce and PKCE verification
      operationId: completeBrowserLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserLogin"
      responses:
        "204":
          description: Sets a Secure HttpOnly SameSite browser session cookie and a session-bound CSRF cookie; never returns a device bearer credential
        "400":
          $ref: "#/components/responses/Problem400"
        "401":
          $ref: "#/components/responses/Problem401"
        "403":
          $ref: "#/components/responses/Problem403"
        "409":
          $ref: "#/components/responses/Problem409"
        "410":
          $ref: "#/components/responses/Problem410"
        "503":
          $ref: "#/components/responses/Problem503"
  /v1/sessions/me:
    get:
      tags: [sessions]
      summary: Inspect the current authenticated actor and workspace memberships
      operationId: getCurrentSession
      security:
        - PMSession: []
        - PMBrowserSession: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Current identity and a bounded membership page; no credential material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSession"
        "400":
          $ref: "#/components/responses/Problem400"
        "401":
          $ref: "#/components/responses/Problem401"
        "403":
          $ref: "#/components/responses/Problem403"
        "503":
          $ref: "#/components/responses/Problem503"
  /v1/sessions/current:
    delete:
      tags: [sessions]
      summary: Revoke the current login session without revoking accepted run grants
      operationId: revokeCurrentSession
      security:
        - PMSession: []
        - PMBrowserSession: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Current login session is revoked or no login session remains
        "400":
          $ref: "#/components/responses/Problem400"
        "401":
          $ref: "#/components/responses/Problem401"
        "403":
          $ref: "#/components/responses/Problem403"
        "503":
          $ref: "#/components/responses/Problem503"
  /v1/workspaces:
    get:
      tags: [workspaces]
      summary: List memberships of the authenticated principal without inferring a workspace
      operationId: listWorkspaces
      security:
        - PMSession: []
        - PMBrowserSession: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A bounded page of currently authorized workspace memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspacePage"
        "400":
          $ref: "#/components/responses/Problem400"
        "401":
          $ref: "#/components/responses/Problem401"
        "403":
          $ref: "#/components/responses/Problem403"
        "503":
          $ref: "#/components/responses/Problem503"
  /v1/workspaces/{workspace_id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    get:
      tags: [workspaces]
      summary: Inspect an explicitly authorized workspace
      operationId: getWorkspace
      security:
        - PMSession: []
        - PMBrowserSession: []
      responses:
        "200":
          description: Current workspace membership and its control revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/Problem400"
        "401":
          $ref: "#/components/responses/Problem401"
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"
        "503":
          $ref: "#/components/responses/Problem503"
  /v1/workspaces/{workspace_id}/connectors:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    get:
      tags: [catalog]
      summary: List the authorized immutable connector catalog and actual lane availability
      operationId: listCatalogConnectors
      security:
        - PMSession: []
        - PMBrowserSession: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Authorized connector catalog page with its capability-bound revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogConnectorPage"
        "400":
          $ref: "#/components/responses/Problem400"
        "401":
          $ref: "#/components/responses/Problem401"
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"
        "503":
          $ref: "#/components/responses/Problem503"
  /v1/workspaces/{workspace_id}/connectors/{connector_id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - $ref: "#/components/parameters/ConnectorCatalogID"
    get:
      tags: [catalog]
      summary: Inspect one authorized immutable connector descriptor
      operationId: getCatalogConnector
      security:
        - PMSession: []
        - PMBrowserSession: []
      responses:
        "200":
          description: Safe connector descriptor and actual lane availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogConnector"
        "400":
          $ref: "#/components/responses/Problem400"
        "401":
          $ref: "#/components/responses/Problem401"
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"
        "503":
          $ref: "#/components/responses/Problem503"
  /v1/workspaces/{workspace_id}/commands:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    get:
      tags: [catalog]
      summary: List connection-authorized safe generated command descriptors
      operationId: listCatalogCommands
      security:
        - PMSession: []
        - PMBrowserSession: []
      parameters:
        - $ref: "#/components/parameters/ConnectionFilter"
        - $ref: "#/components/parameters/CommandFilter"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Principal, workspace, connection, server, and revision-bound command page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafeCommandPage"
        "400":
          $ref: "#/components/responses/Problem400"
        "401":
          $ref: "#/components/responses/Problem401"
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"
        "503":
          $ref: "#/components/responses/Problem503"
  /v1/workspaces/{workspace_id}/commands/{operation_id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - $ref: "#/components/parameters/CatalogOperationID"
    get:
      tags: [catalog]
      summary: Resolve one connection-authorized available generated command
      operationId: getCatalogCommand
      security:
        - PMSession: []
        - PMBrowserSession: []
      parameters:
        - $ref: "#/components/parameters/ConnectionFilter"
      responses:
        "200":
          description: Available safe generated command descriptor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandDescriptor"
        "400":
          $ref: "#/components/responses/Problem400"
        "401":
          $ref: "#/components/responses/Problem401"
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"
        "503":
          $ref: "#/components/responses/Problem503"
  /v1/workspaces/{workspace_id}/connections:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    get:
      tags: [connections]
      summary: List safe connection metadata and its collection revision
      operationId: listConnections
      security:
        - PMSession: []
        - PMBrowserSession: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Scoped page with opaque credential references only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionPage"
        "400":
          $ref: "#/components/responses/Problem400"
        "401":
          $ref: "#/components/responses/Problem401"
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"
        "503":
          $ref: "#/components/responses/Problem503"
    post:
      tags: [connections]
      summary: Create a safe connection against an existing authoritative provider account
      operationId: createConnection
      security:
        - PMSession: []
        - PMBrowserSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionCreateRequest"
      responses:
        "200":
          description: Exact replay of the original safe connection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionMutationResponse"
        "201":
          description: Original committed connection with server-owned identifiers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionMutationResponse"
        "400":
          $ref: "#/components/responses/Problem400"
        "401":
          $ref: "#/components/responses/Problem401"
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"
        "409":
          $ref: "#/components/responses/Problem409"
        "412":
          $ref: "#/components/responses/Problem412"
        "428":
          $ref: "#/components/responses/Problem428"
        "503":
          $ref: "#/components/responses/Problem503"
  /v1/workspaces/{workspace_id}/connections/{connection_id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - $ref: "#/components/parameters/ConnectionID"
    get:
      tags: [connections]
      summary: Inspect safe current connection metadata
      operationId: getConnection
      security:
        - PMSession: []
        - PMBrowserSession: []
      responses:
        "200":
          description: Current connection and resource revision without credential values or private locators
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "400":
          $ref: "#/components/responses/Problem400"
        "401":
          $ref: "#/components/responses/Problem401"
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"
        "503":
          $ref: "#/components/responses/Problem503"
    patch:
      tags: [connections]
      summary: Update safe connection metadata while preserving its credential binding
      operationId: updateConnection
      security:
        - PMSession: []
        - PMBrowserSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionUpdateRequest"
      responses:
        "200":
          description: Updated, unchanged or exactly replayed safe result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionMutationResponse"
        "400":
          $ref: "#/components/responses/Problem400"
        "401":
          $ref: "#/components/responses/Problem401"
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"
        "409":
          $ref: "#/components/responses/Problem409"
        "412":
          $ref: "#/components/responses/Problem412"
        "428":
          $ref: "#/components/responses/Problem428"
        "503":
          $ref: "#/components/responses/Problem503"
    delete:
      tags: [connections]
      summary: Revoke a connection under its current resource revision
      operationId: deleteConnection
      description: Revocation retains durable history and does not imply rollback or cancellation of accepted run grants.
      security:
        - PMSession: []
        - PMBrowserSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionDeleteRequest"
      responses:
        "200":
          description: Revoked, unchanged or exactly replayed safe result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionMutationResponse"
        "400":
          $ref: "#/components/responses/Problem400"
        "401":
          $ref: "#/components/responses/Problem401"
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"
        "409":
          $ref: "#/components/responses/Problem409"
        "412":
          $ref: "#/components/responses/Problem412"
        "428":
          $ref: "#/components/responses/Problem428"
        "503":
          $ref: "#/components/responses/Problem503"
  /v1/workspaces/{workspace_id}/invocations:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    post:
      tags: [invocation]
      summary: Submit one typed invocation intent
      operationId: submitInvocation
      security:
        - PMSession: []
        - PMBrowserSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvocationRequest"
      responses:
        "202":
          description: Durably accepted, nonterminal run identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdmissionResponse"
        "400":
          $ref: "#/components/responses/Problem400"
        "401":
          $ref: "#/components/responses/Problem401"
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"
        "409":
          $ref: "#/components/responses/Problem409"
        "410":
          $ref: "#/components/responses/Problem410"
        "412":
          $ref: "#/components/responses/Problem412"
        "428":
          $ref: "#/components/responses/Problem428"
        "429":
          $ref: "#/components/responses/Problem429"
        "503":
          $ref: "#/components/responses/Problem503"
  /v1/workspaces/{workspace_id}/artifacts:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    post:
      tags: [artifacts]
      summary: Request an authorized artifact upload capability
      operationId: uploadArtifact
      description: >-
        M4 exposes only authorization and explicit capability refusal. No artifact
        byte backend is installed, so this operation advertises no successful
        representation and never fabricates artifact metadata. Send no request
        body: the shared protocol guard rejects a nonempty entity as invalid_request.
        A later byte-storage owner must declare the accepted raw-stream contract
        before enabling byte input or adding a success response.
      security:
        - PMSession: []
        - PMBrowserSession: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "400":
          $ref: "#/components/responses/Problem400"
        "401":
          $ref: "#/components/responses/Problem401"
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"
        "500":
          $ref: "#/components/responses/Problem500"
        "503":
          $ref: "#/components/responses/Problem503"
  /v1/workspaces/{workspace_id}/artifacts/{artifact_id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - $ref: "#/components/parameters/ArtifactID"
    get:
      tags: [artifacts]
      summary: Authorize inspection of one artifact
      operationId: inspectArtifact
      description: >-
        Authorizes the exact private artifact identity before reporting unavailable
        byte storage. Foreign and unknown artifacts remain concealed as
        resource_not_found. M4 advertises no successful metadata representation.
      security:
        - PMSession: []
        - PMBrowserSession: []
      responses:
        "400":
          $ref: "#/components/responses/Problem400"
        "401":
          $ref: "#/components/responses/Problem401"
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"
        "500":
          $ref: "#/components/responses/Problem500"
        "503":
          $ref: "#/components/responses/Problem503"
  /v1/workspaces/{workspace_id}/artifacts/{artifact_id}/content:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - $ref: "#/components/parameters/ArtifactID"
    get:
      tags: [artifacts]
      summary: Authorize download of one artifact
      operationId: downloadArtifact
      description: >-
        Applies the exact artifact authorization and concealment precedence before
        reporting unavailable byte storage. M4 serves no body, range metadata,
        digest, length, media type, or successful content response.
      security:
        - PMSession: []
        - PMBrowserSession: []
      responses:
        "400":
          $ref: "#/components/responses/Problem400"
        "401":
          $ref: "#/components/responses/Problem401"
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"
        "500":
          $ref: "#/components/responses/Problem500"
        "503":
          $ref: "#/components/responses/Problem503"
  /v1/workspaces/{workspace_id}/runs:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    get:
      tags: [runs]
      summary: List currently authorized runs
      operationId: listRuns
      description: >-
        Returns a scope-bound cursor page of safe run projections. Each projection
        identifies the immutable accepted connection and operation-or-plan context;
        it does not expose the RunSpec, execution grant, inputs, credentials or
        orchestration internals.
      security:
        - PMSession: []
        - PMBrowserSession: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/RunStateFilter"
      responses:
        "200":
          description: Scope-bound run page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunPage"
        "400":
          $ref: "#/components/responses/Problem400"
        "401":
          $ref: "#/components/responses/Problem401"
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"
        "503":
          $ref: "#/components/responses/Problem503"
  /v1/workspaces/{workspace_id}/runs/{run_id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - $ref: "#/components/parameters/RunID"
    get:
      tags: [runs]
      summary: Inspect one authorized run
      operationId: getRun
      description: >-
        Authorizes the immutable accepted connection and operation-or-plan context
        before returning current PostgreSQL-owned run and effect truth. Revocation
        of execution authority does not rewrite or by itself hide an otherwise
        authorized historical run view.
      security:
        - PMSession: []
        - PMBrowserSession: []
      responses:
        "200":
          description: Safe run projection
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunView"
        "400":
          $ref: "#/components/responses/Problem400"
        "401":
          $ref: "#/components/responses/Problem401"
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"
        "503":
          $ref: "#/components/responses/Problem503"
  /v1/workspaces/{workspace_id}/runs/{run_id}/events:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - $ref: "#/components/parameters/RunID"
    get:
      tags: [runs]
      summary: Watch one authorized run through durable committed events
      operationId: watchRunEvents
      description: >-
        Replays PostgreSQL-authoritative per-run sequence order after the optional
        signed cursor, then follows committed events. The first snapshot carries
        authoritative run truth, its durable watermark, an explicit retention-gap
        flag and a reconnect cursor. Heartbeats are SSE comments. Disconnecting
        ends only this response and never requests durable run cancellation.
      security:
        - PMSession: []
        - PMBrowserSession: []
      parameters:
        - $ref: "#/components/parameters/LastEventID"
      responses:
        "200":
          description: >-
            Long-lived text/event-stream. An event named snapshot has JSON data
            matching RunEventSnapshotData and MUST NOT carry an SSE id field. An
            event named run_event has JSON data matching RunEventData and MUST
            carry an opaque signed EventCursor in its SSE id field.
          content:
            text/event-stream:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RunEventSnapshotData"
                  - $ref: "#/components/schemas/RunEventData"
                description: Schema applies to each decoded SSE data field, not to a buffered aggregate response.
        "400":
          $ref: "#/components/responses/Problem400"
        "401":
          $ref: "#/components/responses/Problem401"
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"
        "500":
          $ref: "#/components/responses/Problem500"
        "503":
          $ref: "#/components/responses/Problem503"
  /v1/workspaces/{workspace_id}/runs/{run_id}/result:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - $ref: "#/components/parameters/RunID"
    get:
      tags: [runs]
      summary: List available result references for one authorized run
      operationId: getRunResult
      description: >-
        Returns only currently available immutable result references beside
        PostgreSQL-owned effect truth. An empty result_references array is explicit;
        orchestration closure never fabricates a result or a successful effect.
      security:
        - PMSession: []
        - PMBrowserSession: []
      responses:
        "200":
          description: Truthful run result-reference projection
          headers:
            ETag:
