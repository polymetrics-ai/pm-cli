components:
  securitySchemes:
    PMSession:
      type: http
      scheme: bearer
    PMBrowserSession:
      type: apiKey
      in: cookie
      name: __Host-pm_session
      description: Secure HttpOnly SameSite browser transport; state-changing requests additionally require exact origin and session-bound CSRF.
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required and verified for authenticated browser mutations; never substitutes for the current session or explicit authorization.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    LastEventID:
      name: Last-Event-ID
      in: header
      required: false
      description: >-
        Optional; when present there MUST be exactly one nonempty opaque signed
        event cursor. It is bound to the authorized organization, workspace, run
        and durable sequence; it is not a raw sequence number and cannot select
        another scope.
      schema:
        $ref: "#/components/schemas/EventCursor"
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
    ConnectionID:
      name: connection_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 512
    ConnectorCatalogID:
      name: connector_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 512
    CatalogOperationID:
      name: operation_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    ConnectionFilter:
      name: connection_id
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 512
    CommandFilter:
      name: filter
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
    WorkspaceID:
      name: workspace_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 512
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 512
    RunID:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 512
    ArtifactID:
      name: artifact_id
      in: path
      required: true
      description: Private opaque artifact identity; never a bearer capability.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    TaskID:
      name: task_id
      in: path
      required: true
      description: Deterministic reversible opaque encoding of the exact run and stored task IDs inside the authorized workspace; it is not a bearer capability or alternate selector.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    RunStateFilter:
      name: state
      in: query
      required: false
      description: Restrict the workspace-scoped page to one canonical run state.
      schema:
        $ref: "#/components/schemas/RunState"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Required for a new mutation after current authorization and receipt lookup; exact replay is resolved before new-mutation revision checks. A supplied value must match the intent envelope.
      schema:
        type: string
        minLength: 1
        maxLength: 512
  headers:
    ETag:
      description: Opaque scope-bound revision validator for this authorized representation; it is not a mutation idempotency key.
      schema:
        type: string
        minLength: 1
        maxLength: 512
  responses:
    Problem400:
      description: Malformed or unsupported typed request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Problem401:
      description: Authentication is required
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Problem403:
      description: The required grant is unavailable after authorized scope resolution
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Problem404:
      description: Resource is absent or hidden by scope
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Problem409:
      description: Intent, capability, specification, resume, or foundation conflict
      content:
        application/problem+json:
          schema:
