<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Store a PM connection credential</title>
  <link rel="stylesheet" href="/assets/pm.css">
  <script src="/assets/credentials.js" defer></script>
</head>
<body>
  <main class="shell" aria-labelledby="page-title">
    <section class="card card-wide">
      <p class="eyebrow">PM Server</p>
      <h1 id="page-title">Store a connection credential</h1>
      <p class="lede">The value is sent only to PM’s private write-only ingress. It is not placed in browser storage or the page URL.</p>
      <form id="credential-form" method="post" action="/admin/credentials" autocomplete="off">
        <div class="grid">
          <div>
            <label for="workspace-id">Workspace ID</label>
            <input id="workspace-id" name="workspace_id" type="text" maxlength="512" required spellcheck="false" autocomplete="off">
          </div>
          <div>
            <label for="connection-id">Connection ID</label>
            <input id="connection-id" name="connection_id" type="text" maxlength="512" required spellcheck="false" autocomplete="off">
          </div>
        </div>
        <label for="scopes">Binding scopes <span class="hint">One per line</span></label>
        <textarea id="scopes" name="scopes" rows="4" maxlength="65536" spellcheck="false" autocomplete="off"></textarea>
        <label for="credential-value">Credential value</label>
        <input id="credential-value" name="credential_value" type="password" maxlength="65536" required spellcheck="false" autocomplete="off">
        <div class="actions">
          <button type="submit">Store credential</button>
          <button id="reauthenticate" class="secondary" type="button">Reauthenticate first</button>
        </div>
      </form>
      <p id="status" class="status" role="status" aria-live="assertive"></p>
      <nav aria-label="PM authentication actions">
        <a href="/login">Sign in</a>
        <a href="/login/device">Approve a device login</a>
      </nav>
    </section>
  </main>
</body>
</html>
