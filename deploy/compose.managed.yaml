services:
  postgres:
    profiles: [bundled-postgres]
  postgres-bootstrap:
    profiles: [bundled-postgres]
  temporal-schema:
    profiles: [bundled-temporal]
  temporal:
    profiles: [bundled-temporal]
    volumes:
      - ${PM_STACK_TEMPORAL_DYNAMIC_CONFIG:-${PM_STACK_ROOT:?}/deploy/temporal/dynamicconfig.yaml}:/etc/temporal/dynamicconfig.yaml:ro
  seaweed-master:
    profiles: [bundled-artifacts]
  seaweed-volume:
    profiles: [bundled-artifacts]
  seaweed-filer:
    profiles: [bundled-artifacts]
  seaweed-s3-a:
    profiles: [bundled-artifacts]
  seaweed-s3-b:
    profiles: [bundled-artifacts]
  caddy:
    profiles: [bundled-artifacts]
