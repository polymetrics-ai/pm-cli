name: PM foundation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  foundation:
    if: github.repository == 'polymetrics-ai/pm-cli' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'karthik-sivadas' && github.triggering_actor == 'karthik-sivadas'
    runs-on: [self-hosted, Linux, X64, pm-cli-qual-20260911-r8]
    timeout-minutes: 30
    steps:
      - name: Check out the pull request revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
          set-safe-directory: false
          submodules: false
      - name: Build and test the foundation
        run: sh scripts/ci/check-foundation.sh
