name: PM foundation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Each shard runs in the pinned CI image (build/ci/Dockerfile) on an
  # ephemeral, rootless Podman runner. See docs/development/ci.md.
  shard:
    if: github.repository == 'polymetrics-ai/pm-cli' && github.actor == 'karthik-sivadas' && github.triggering_actor == 'karthik-sivadas' && ((github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.pull_request.merged == false && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.deleted == false && github.event.forced == false))
    strategy:
      fail-fast: false
      matrix:
        shard: [build, stack-a, stack-b]
    runs-on: [self-hosted, Linux, X64, pm-cli-vps]
    timeout-minutes: 60
    env:
      PMCLI_SHARD: ${{ matrix.shard }}
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false
          set-safe-directory: false
          submodules: false
      - name: Build and test the foundation shard
        timeout-minutes: 50
        run: sh scripts/ci/in-ci-image.sh run "foundation-$PMCLI_SHARD" -- sh scripts/ci/check-foundation.sh "$PMCLI_SHARD"
      - name: Clean up the job container and dependency fixture
        if: always()
        timeout-minutes: 6
        run: |
          sh scripts/ci/in-ci-image.sh stop "foundation-$PMCLI_SHARD"
          sh scripts/ci/in-ci-image.sh run "cleanup-$PMCLI_SHARD" -- python3 scripts/ci/with-stack-fixture.py \
            --cleanup "$RUNNER_TEMP/pmcli-foundation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"

  # The required check. A failed, cancelled or skipped shard fails it.
  foundation:
    needs: shard
    if: always() && github.repository == 'polymetrics-ai/pm-cli' && github.actor == 'karthik-sivadas' && github.triggering_actor == 'karthik-sivadas' && ((github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.pull_request.merged == false && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.deleted == false && github.event.forced == false))
    runs-on: [self-hosted, Linux, X64, pm-cli-vps]
    timeout-minutes: 5
    env:
      SHARD_RESULT: ${{ needs.shard.result }}
    steps:
      - name: Require every foundation shard
        run: test "$SHARD_RESULT" = success
