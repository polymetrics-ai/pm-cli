name: PM foundation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  foundation:
    if: github.repository == 'polymetrics-ai/pm-cli' && github.actor == 'karthik-sivadas' && github.triggering_actor == 'karthik-sivadas' && ((github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.pull_request.merged == false && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.deleted == false && github.event.forced == false))
    runs-on: [self-hosted, Linux, X64, pm-cli-qual-20260911-r8]
    timeout-minutes: 30
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false
          set-safe-directory: false
          submodules: false
      - name: Build and test the foundation
        timeout-minutes: 25
        run: sh scripts/ci/check-foundation.sh
      - name: Clean up the job-owned dependency fixture
        if: always()
        timeout-minutes: 4
        run: |
          export PATH="/opt/pmcli-tools/venv/bin:/opt/pmcli-tools/bin:$PATH"
          python3 scripts/ci/with-stack-fixture.py \
            --cleanup "$RUNNER_TEMP/pmcli-foundation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
