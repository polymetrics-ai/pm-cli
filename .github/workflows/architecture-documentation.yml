# Early CI setup associated with issue #3; it does not complete the build/Bazel pilot.
name: Architecture documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

# This gate runs on open PRs targeting `main` and each merged main revision:
# use a separate `Closes #N` for every fully completed
# issue and `Refs #N` for partial work. Grouped PRs list each applicable issue.
# Stacked PRs must track each issue explicitly through final default-branch
# integration; an intermediate merge does not complete it.
# Publication PR #47 uniquely requires issue #46.

permissions:
  contents: read

concurrency:
  group: architecture-documentation-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: architecture-documentation
    # The PMCLI runner executes only same-repository trusted workflow code.
    if: github.repository == 'polymetrics-ai/pm-cli' && github.actor == 'karthik-sivadas' && github.triggering_actor == 'karthik-sivadas' && ((github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.pull_request.merged == false && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.deleted == false && github.event.forced == false))
    # R9's temporary qualification label limits this supervised job to the
    # dedicated PMCLI runner until normal routing is separately authorized.
    runs-on: [self-hosted, Linux, X64, pm-cli-qual-20260911-r8]
    timeout-minutes: 3
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false
          set-safe-directory: false
          submodules: false
      - name: Materialize pinned job-scoped test dependencies
        run: |
          set -eu
          /opt/pmcli-tools/venv/bin/python3 \
            scripts/install_architecture_docs_dependencies.py \
            --destination "$RUNNER_TEMP/architecture-docs-deps"
      - name: Verify pinned documentation test dependency
        run: |
          set -eu
          PYTHONPATH="$RUNNER_TEMP/architecture-docs-deps" \
            /opt/pmcli-tools/venv/bin/python3 - <<'PY'
          from importlib.metadata import version
          assert version("jsonschema") == "4.25.1"
          PY
      - name: Run architecture documentation contracts
        run: |
          set -eu
          export PYTHONPATH="$RUNNER_TEMP/architecture-docs-deps"
          /opt/pmcli-tools/venv/bin/python3 scripts/test_validate_architecture_docs.py
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            /opt/pmcli-tools/venv/bin/python3 scripts/validate_architecture_docs.py --pr-event "$GITHUB_EVENT_PATH"
          else
            /opt/pmcli-tools/venv/bin/python3 scripts/validate_architecture_docs.py
          fi
