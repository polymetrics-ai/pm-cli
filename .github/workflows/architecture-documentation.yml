# Early CI setup associated with issue #3; it does not complete the build/Bazel pilot.
name: Architecture documentation

on:
  pull_request:
    branches: [main, omp/pmcli-foundations]
    types: [opened, synchronize, reopened, edited]

# This gate runs on PRs targeting `main` or the approved stack base
# `omp/pmcli-foundations`: use a separate `Closes #N` for every fully completed
# issue and `Refs #N` for partial work. Grouped PRs list each applicable issue.
# Stacked PRs must track each issue explicitly through final default-branch
# integration; an intermediate merge does not complete it.
# Publication PR #47 uniquely requires issue #46.

permissions:
  contents: read

concurrency:
  group: architecture-documentation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: architecture-documentation
    # The PMCLI runner executes only same-repository trusted workflow code.
    if: github.event.pull_request.head.repo.full_name == github.repository
    # R9's temporary qualification label limits this supervised job to the
    # dedicated PMCLI runner until normal routing is separately authorized.
    runs-on: [self-hosted, Linux, X64, pm-cli-qual-20260911-r8]
    timeout-minutes: 3
    steps:
      - name: Check out the pull request revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
          set-safe-directory: false
          submodules: false
      - name: Materialize pinned job-scoped test dependencies
        run: |
          set -eu
          /opt/pmcli-tools/venv/bin/python3 \
            scripts/install_architecture_docs_dependencies.py \
            --destination "$RUNNER_TEMP/architecture-docs-deps"
      - name: Verify pinned documentation test dependency
        run: |
          set -eu
          PYTHONPATH="$RUNNER_TEMP/architecture-docs-deps" \
            /opt/pmcli-tools/venv/bin/python3 - <<'PY'
          from importlib.metadata import version
          assert version("jsonschema") == "4.25.1"
          PY
      - name: Run architecture documentation contracts
        run: |
          set -eu
          export PYTHONPATH="$RUNNER_TEMP/architecture-docs-deps"
          /opt/pmcli-tools/venv/bin/python3 scripts/test_validate_architecture_docs.py
          /opt/pmcli-tools/venv/bin/python3 scripts/validate_architecture_docs.py --pr-event "$GITHUB_EVENT_PATH"
